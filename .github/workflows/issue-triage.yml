name: issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- auto-triage -->';
            const issue = context.payload.issue;
            if (issue.body && issue.body.includes(marker)) return;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'triage',
                color: 'ededed',
                description: 'Pendiente clasificar',
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['triage'],
            });

            const original = issue.body || '_Sin descripción._';
            const body = `${original}\n\n---\n${marker}\n### Checklist repo\n- [ ] Pasos reproducir\n- [ ] Navegador / versión\n- [ ] Nave afectada [1-5] / NIVEL / SCORE\n- [ ] Archivos: \`game.js\`, \`index.html\`\n- [ ] Commit: \`${context.sha}\`\n\n> Texto original arriba intacto, sin reescritura.\n\n#### Metadata\n- Autor: @${issue.user.login}\n- Fecha: ${issue.created_at}\n- Repo: ${context.repo.owner}/${context.repo.repo}#${issue.number}\n`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
